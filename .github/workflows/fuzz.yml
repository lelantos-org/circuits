name: fuzz

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      fuzz_mode:
        description: 'FUZZ tier (light/medium/heavy)'
        required: false
        default: 'heavy'

permissions:
  contents: read

# Fuzz runs are long (heavy mode, 30-minute mocha timeout), so a manual
# workflow_dispatch on the same ref does not cancel an in-flight nightly run.
# PR and push runs (light / medium) are cheap enough to leave on GitHub's
# default per-ref dedup.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    runs-on: [ubuntu-latest]
    # PR runs use FUZZ=light (~minutes); push-to-main FUZZ=medium; cron +
    # manual default FUZZ=heavy. Single timeout covers heavy mode.
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      FUZZ: >-
        ${{
          github.event_name == 'pull_request' && 'light' ||
          github.event_name == 'push' && 'medium' ||
          github.event_name == 'workflow_dispatch' && (inputs.fuzz_mode || 'heavy') ||
          'heavy'
        }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Run fuzz suite (FUZZ=${{ env.FUZZ }})
        run: just test-fuzz

name: fuzz

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Fuzz runs are long (heavy mode, 30-min mocha timeout). Do not cancel an
# in-flight nightly run when a manual workflow_dispatch fires on the same
# ref — let the running job finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: [self-hosted]
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    env:
      CIRCOM_VERSION: v2.2.3
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-circom-${{ env.CIRCOM_VERSION }}

      - name: Cache circom binary
        id: cache-circom
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/circom
          key: circom-${{ env.CIRCOM_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install circom
        if: steps.cache-circom.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          os=$(uname -s)
          arch=$(uname -m)
          case "$os-$arch" in
            Linux-x86_64)  asset=circom-linux-amd64 ;;
            Darwin-x86_64) asset=circom-macos-amd64 ;;
            *)             asset="" ;;
          esac
          if [ -n "$asset" ]; then
            curl -L "https://github.com/iden3/circom/releases/download/${CIRCOM_VERSION}/${asset}" \
              -o "$HOME/.local/bin/circom"
            chmod +x "$HOME/.local/bin/circom"
          else
            cargo install --git https://github.com/iden3/circom --tag "${CIRCOM_VERSION}" --root "$HOME/.local" circom
          fi

      - name: Add circom to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify circom
        run: circom --version

      - name: Install npm dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run heavy fuzz suite
        run: npm run test:fuzz

name: fuzz

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      fuzz_mode:
        description: 'FUZZ tier (light/medium/heavy)'
        required: false
        default: 'heavy'
      fuzz_seed:
        description: 'FUZZ_SEED to replay (blank = use the run id)'
        required: false
        default: ''

permissions:
  contents: read

# Fuzz runs are long (heavy mode, 30-minute mocha timeout), so a manual
# workflow_dispatch on the same ref does not cancel an in-flight nightly run.
# PR and push runs (light / medium) are cheap enough to leave on GitHub's
# default per-ref dedup.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    runs-on: [ubuntu-latest]
    # PR runs use FUZZ=light (~minutes); push-to-main FUZZ=medium; cron +
    # manual default FUZZ=heavy. Single timeout covers heavy mode.
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      FUZZ: >-
        ${{
          github.event_name == 'pull_request' && 'light' ||
          github.event_name == 'push' && 'medium' ||
          github.event_name == 'workflow_dispatch' && (inputs.fuzz_mode || 'heavy') ||
          'heavy'
        }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup toolchain
        uses: ./.github/actions/setup

      # The seed is chosen here rather than left to the clock inside
      # `test/fuzz/arbitraries.ts`, so the run is reproducible from the job
      # summary alone. Without it a nightly `FUZZ=heavy` failure is a witness
      # nobody can regenerate: fast-check prints the seed, but only into log
      # scrollback that expires, and a re-run draws a different sequence.
      #
      # `workflow_dispatch` can override it, which is how a failed nightly is
      # re-run against the exact seed that failed.
      - name: Pick fuzz seed
        run: echo "FUZZ_SEED=${{ inputs.fuzz_seed || github.run_id }}" >> "$GITHUB_ENV"

      - name: Run fuzz suite (FUZZ=${{ env.FUZZ }})
        run: just test-fuzz

      # `always()`: the replay line matters most when the step above failed.
      # The job summary outlives the logs, so this is what someone reads a week
      # later to reproduce a nightly.
      - name: Record replay command
        if: always()
        run: |
          {
            echo "### Fuzz run"
            echo
            echo "\`\`\`"
            echo "FUZZ=$FUZZ FUZZ_SEED=$FUZZ_SEED just test-fuzz"
            echo "\`\`\`"
            echo
            echo "To replay a single shrunk counterexample, add the \`path\` from the"
            echo "fast-check report and grep to that test:"
            echo
            echo "\`\`\`"
            echo "FUZZ=$FUZZ FUZZ_SEED=$FUZZ_SEED FUZZ_PATH=<path> npm run test:fuzz -- --grep \"<test name>\""
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

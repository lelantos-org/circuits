name: fuzz

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      fuzz_mode:
        description: 'FUZZ tier (light/medium/heavy)'
        required: false
        default: 'heavy'
      fuzz_seed:
        description: 'FUZZ_SEED to replay (blank = use the run id)'
        required: false
        default: ''

permissions:
  contents: read

# Heavy fuzz runs are long (30-minute mocha timeout), so only pull_request runs
# cancel an in-progress run on the same ref; a manual workflow_dispatch does not
# cancel a running nightly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    runs-on: [ubuntu-latest]
    # PR runs use FUZZ=light; pushes to main use FUZZ=medium; scheduled and
    # manual runs default to FUZZ=heavy. The timeout is sized for heavy mode.
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      FUZZ: >-
        ${{
          github.event_name == 'pull_request' && 'light' ||
          github.event_name == 'push' && 'medium' ||
          github.event_name == 'workflow_dispatch' && (inputs.fuzz_mode || 'heavy') ||
          'heavy'
        }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup toolchain
        uses: ./.github/actions/setup

      # The seed is chosen here rather than from the clock in
      # `test/fuzz/arbitraries.ts`, so every run is reproducible from the job
      # summary, which outlives the logs.
      #
      # `workflow_dispatch` can override it to replay a failed run's seed.
      - name: Pick fuzz seed
        run: echo "FUZZ_SEED=${{ inputs.fuzz_seed || github.run_id }}" >> "$GITHUB_ENV"

      - name: Run fuzz suite (FUZZ=${{ env.FUZZ }})
        run: just test-fuzz

      # `always()`, so the replay command is recorded when the fuzz step fails.
      # The job summary is retained longer than the logs.
      - name: Record replay command
        if: always()
        run: |
          {
            echo "### Fuzz run"
            echo
            echo "\`\`\`"
            echo "FUZZ=$FUZZ FUZZ_SEED=$FUZZ_SEED just test-fuzz"
            echo "\`\`\`"
            echo
            echo "To replay a single shrunk counterexample, add the \`path\` from the"
            echo "fast-check report and grep to that test:"
            echo
            echo "\`\`\`"
            echo "FUZZ=$FUZZ FUZZ_SEED=$FUZZ_SEED FUZZ_PATH=<path> npm run test:fuzz -- --grep \"<test name>\""
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

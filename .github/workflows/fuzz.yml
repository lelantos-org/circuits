name: fuzz

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      fuzz_mode:
        description: 'FUZZ tier (light/medium/heavy)'
        required: false
        default: 'heavy'
      fuzz_seed:
        description: 'FUZZ_SEED to replay (blank = use the run id)'
        required: false
        default: ''

permissions:
  contents: read

# Only pull_request runs cancel an in-progress run on the same ref; a manual
# workflow_dispatch does not cancel a running nightly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    runs-on: [ubuntu-latest]
    # Sized for FUZZ=heavy.
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      FUZZ: >-
        ${{
          github.event_name == 'pull_request' && 'light' ||
          github.event_name == 'push' && 'medium' ||
          github.event_name == 'workflow_dispatch' && (inputs.fuzz_mode || 'heavy') ||
          'heavy'
        }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup toolchain
        uses: ./.github/actions/setup

      # Chosen here so every run is reproducible from the job summary, which
      # outlives the logs. `workflow_dispatch` can override it to replay a seed.
      - name: Pick fuzz seed
        run: echo "FUZZ_SEED=${{ inputs.fuzz_seed || github.run_id }}" >> "$GITHUB_ENV"

      - name: Run fuzz suite (FUZZ=${{ env.FUZZ }})
        run: just test-fuzz

      # `always()`, so the replay command is recorded when the fuzz step fails.
      - name: Record replay command
        if: always()
        run: |
          {
            echo "### Fuzz run"
            echo
            echo "\`\`\`"
            echo "FUZZ=$FUZZ FUZZ_SEED=$FUZZ_SEED just test-fuzz"
            echo "\`\`\`"
            echo
            echo "To replay a single shrunk counterexample, add the \`path\` from the"
            echo "fast-check report and grep to that test:"
            echo
            echo "\`\`\`"
            echo "FUZZ=$FUZZ FUZZ_SEED=$FUZZ_SEED FUZZ_PATH=<path> npm run test:fuzz -- --grep \"<test name>\""
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  circomspect:
    runs-on: [ubuntu-latest]
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Pinned so the reviewed suppression baseline in the justfile `lint`
      # recipe stays valid.
      CIRCOMSPECT_VERSION: 0.9.0
    steps:
      - uses: actions/checkout@v4

      # circomspect reads the sources directly; this job compiles no circuit.
      - name: Setup toolchain
        uses: ./.github/actions/setup
        with:
          circom: 'false'

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-circomspect-${{ env.CIRCOMSPECT_VERSION }}

      - name: Cache cargo bin
        id: cache-cargo
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/circomspect
          key: circomspect-${{ env.CIRCOMSPECT_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install build toolchain (cc/linker for cargo)
        if: steps.cache-cargo.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install Rust toolchain
        if: steps.cache-cargo.outputs.cache-hit != 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install circomspect
        if: steps.cache-cargo.outputs.cache-hit != 'true'
        run: cargo install circomspect --locked --version "${CIRCOMSPECT_VERSION}"

      # circomspect exits non-zero on any warning. Waived passes and their
      # rationale are in the justfile `lint` recipe.
      - name: Run circomspect
        run: just lint

name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  circomspect:
    runs-on: [ubuntu-latest]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # circomspect reads the sources directly; this job compiles no circuit.
      - name: Setup toolchain
        uses: ./.github/actions/setup
        with:
          circom: 'false'

      - name: Setup circomspect
        uses: ./.github/actions/setup-circomspect

      # circomspect exits non-zero on any warning. Waived passes and their
      # rationale are in the justfile `lint` recipe.
      - name: Run circomspect
        run: just lint

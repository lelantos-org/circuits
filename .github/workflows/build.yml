name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [ubuntu-latest]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup toolchain
        uses: ./.github/actions/setup

      # Compiles every shape in budget.json; the budget check reads one .r1cs per
      # entry and fails on a missing or stale one. Other jobs compile only through
      # `just vectors-check` and circom_tester, neither of which uses the
      # production `--r1cs --wasm --sym` path or reports constraint counts.
      - name: Compile circuits (4x6, tree_update_batch)
        run: just compile-4x6 compile-batch

      - name: Setup build-circuit
        uses: ./.github/actions/setup-build-circuit

      # The witness-graph builder cannot compile `signal <== someFunction()`, so
      # the circuits assign such calls through a `var` (see src/lib/note.circom).
      # This step detects violations before they fail the publish workflow.
      - name: Witness graph builds
        run: just build-graph

      # Compilation does not check circuit size, and `groth16 setup`, which would
      # reject an oversized circuit, does not run here, so constraint counts are
      # checked separately.
      - name: Constraint budget
        run: just budget

      # Checks that every field of the Lean witness structures is a signal of the
      # compiled circuit. It runs here because this is the only job producing
      # `build/*.sym`; circom_tester writes elsewhere, so the test skips in the
      # `test` workflow. `REQUIRE_ARTIFACTS=1` makes a missing artifact a failure.
      - name: Model signal parity
        run: just signal-parity

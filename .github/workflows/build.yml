name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [ubuntu-latest]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup toolchain
        uses: ./.github/actions/setup

      # Compiles every shape in budget.json; the budget check reads one .r1cs per
      # entry.
      - name: Compile circuits (4x6, tree_update_batch)
        run: just compile-4x6 compile-batch

      - name: Setup build-circuit
        uses: ./.github/actions/setup-build-circuit

      # The witness-graph builder cannot compile `signal <== someFunction()`; this
      # detects such assignments before they fail the publish workflow.
      - name: Witness graph builds
        run: just build-graph

      # Compilation does not check circuit size, and `groth16 setup` does not run
      # here.
      - name: Constraint budget
        run: just budget

      # Checks that every field of the Lean witness structures is a signal of the
      # compiled circuit. Runs here because only this job produces `build/*.sym`.
      - name: Model signal parity
        run: just signal-parity

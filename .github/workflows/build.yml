name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [ubuntu-latest]
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CIRCOM_VERSION: v2.2.3
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Setup circom
        uses: ./.github/actions/setup-circom
        with:
          version: ${{ env.CIRCOM_VERSION }}

      - name: Install npm dependencies
        run: npm ci

      # All three deployed shapes. 3x3 and tree_update_batch are otherwise only
      # compiled indirectly — by `just vectors-check` and by circom_tester inside
      # the mocha suite — neither of which runs the production
      # `--r1cs --wasm --sym` path or prints constraint counts. This is the only
      # job that would notice a constraint blowup pushing a circuit past its ptau.
      - name: Compile circuits (2x2, 3x3, tree_update_batch)
        run: just compile compile-3x3 compile-batch

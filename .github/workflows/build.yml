name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [ubuntu-latest]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup toolchain
        uses: ./.github/actions/setup

      # Every shape in budget.json — the gate below reads one .r1cs per entry
      # and fails on a missing or stale one. Both are otherwise compiled only
      # indirectly, by `just vectors-check` and by circom_tester inside the mocha
      # suite, neither of which runs the production `--r1cs --wasm --sym` path or
      # reports constraint counts.
      - name: Compile circuits (4x6, tree_update_batch)
        run: just compile-4x6 compile-batch

      # The witness-graph builder cannot compile `signal <== someFunction()`, so
      # the circuits hoist those through a `var` (see src/lib/note.circom). This
      # step is what stops someone inlining one back: the release would
      # otherwise fail at publish time instead. It builds the pinned
      # build-circuit from git, which compiles the circom front end and is slow
      # on a cold cache.
      - name: Witness graph builds
        run: just build-graph

      # Compiling asserts nothing about size, and `groth16 setup` — where an
      # overflow would surface — does not run here. Transact(10,3,3) clears its
      # 2^16 FFT domain by 13 constraints, so the count needs its own gate.
      - name: Constraint budget
        run: just budget

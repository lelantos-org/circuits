name: publish

# Tag-driven release. Pushing a tag matching `v*` (e.g. `v0.1.0`) rebuilds the
# artifacts from circom and ptau, runs the sanity checks, publishes to GitHub
# Packages, and writes per-release SHA-256 hashes into the release body for
# downstream verification.
#
# The trusted-setup ceremony is non-deterministic — snarkjs mixes fresh
# randomness into the contribution regardless of `-e` — so the zkey and vkey
# SHA-256 are recorded per release rather than pinned in advance.
#
# Everything that can fail cheaply runs before `npm publish`, because publishing
# to GitHub Packages cannot be undone: a version number is spent even if the
# release step afterwards fails.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [ubuntu-latest]
    timeout-minutes: 60
    permissions:
      contents: write   # required to attach SHAs to the release body
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@lelantos-org"
          always-auth: true
          cache: npm

      - name: Confirm tag version matches package.json
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      - name: Install just
        uses: extractions/setup-just@v2

      # Version pinned inside the action, so the release compiles with the same
      # circom as CI. This job does not use ./.github/actions/setup: it needs
      # registry-url / scope / always-auth on setup-node, and interleaves the
      # tag-version check and the ptau cache between these steps.
      - name: Setup circom
        uses: ./.github/actions/setup-circom

      # 2x2, 3x3 and tree_update_batch size to a 2^16 domain and share one ptau.
      - name: Cache ptau
        uses: actions/cache@v4
        with:
          path: ptau/powersOfTau28_hez_final_16.ptau
          key: ptau-16

      # 4x4 is 86,680 constraints and does not fit 2^16, so its ceremony needs
      # its own ptau. Cached separately: a 3x3-only rebuild should not pay the
      # 2^17 download.
      - name: Cache ptau-17
        uses: actions/cache@v4
        with:
          path: ptau/powersOfTau28_hez_final_17.ptau
          key: ptau-17

      - name: Install npm dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The package ships vectors/ as the cross-repo contract the SDK checks
      # itself against. Nothing else in this job would notice them being stale,
      # and regenerating is far cheaper than the ceremonies below.
      - name: Golden vectors are current
        run: just vectors-check

      # Runs three transact ceremonies (2x2, 3x3, 4x4) and the publish gate.
      - name: Build + verify 2x2 + 3x3 + 4x4 artifacts
        run: just package

      - name: Build tree_update_batch artifacts
        run: |
          just compile-batch setup-batch
          # Stage the flat wasm next to its r1cs for release upload.
          cp build/tree_update_batch_js/tree_update_batch.wasm build/tree_update_batch.wasm

      # `setup` writes the 2x2 verifier to build/Verifier.sol and `setup-3x3`
      # writes the deployed one to build/Verifier3x3.sol. Uploading the former
      # under the bare name `Verifier.sol` invites a downloader to install the
      # NON-deployed shape — the same filename hazard the justfile warns about
      # for the contracts sync. Every release asset is named for its shape.
      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p release
          cp build/2x2.r1cs                          release/2x2.r1cs
          cp build/2x2.wasm                          release/2x2.wasm
          cp build/2x2_final.zkey                    release/2x2_final.zkey
          cp build/verification_key.json             release/2x2_verification_key.json
          cp build/Verifier.sol                      release/Verifier2x2.sol
          cp build/3x3.r1cs                          release/3x3.r1cs
          cp build/3x3.wasm                          release/3x3.wasm
          cp build/3x3_final.zkey                    release/3x3_final.zkey
          cp build/3x3_verification_key.json         release/3x3_verification_key.json
          cp build/Verifier3x3.sol                   release/Verifier3x3.sol
          cp build/4x4.r1cs                          release/4x4.r1cs
          cp build/4x4.wasm                          release/4x4.wasm
          cp build/4x4_final.zkey                    release/4x4_final.zkey
          cp build/4x4_verification_key.json         release/4x4_verification_key.json
          cp build/Verifier4x4.sol                   release/Verifier4x4.sol
          cp build/tree_update_batch.r1cs            release/tree_update_batch.r1cs
          cp build/tree_update_batch.wasm            release/tree_update_batch.wasm
          cp build/tree_update_batch_final.zkey      release/tree_update_batch_final.zkey
          cp build/tree_update_batch_verification_key.json \
                                                     release/tree_update_batch_verification_key.json
          # The generated contract name collides with the transact verifiers, so
          # rename it before anyone compiles the three together.
          sed 's/contract Groth16Verifier/contract TreeUpdateBatchGroth16Verifier/' \
            build/TreeUpdateBatchVerifier.sol > release/TreeUpdateBatchVerifier.sol

      - name: Record release asset hashes
        id: shas
        run: |
          set -euo pipefail
          {
              echo 'release_shas<<EOF'
              ( cd release && sha256sum -- * )
              echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # `files` in package.json is a whitelist, and npm silently skips an entry
      # that does not exist — so a stale filename there ships a package whose
      # index.json references a vector the tarball does not contain. Assert the
      # tarball actually holds what index.json advertises.
      - name: Package contents match the vector index
        run: |
          set -euo pipefail
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            const pack = require("/tmp/pack.json")[0];
            const shipped = new Set(pack.files.map(f => f.path));
            const index = require("./vectors/index.json");
            const missing = ["vectors/index.json", ...Object.keys(index.files).map(f => `vectors/${f}`)]
              .filter(f => !shipped.has(f));
            if (missing.length) {
              console.error(`::error::package.json files/exports omit: ${missing.join(", ")}`);
              process.exit(1);
            }
            console.log(`package ships ${shipped.size} files, including every published vector`);
          '

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach artifacts + release notes
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body: |
            Published `@lelantos-org/circuits@${{ github.ref_name }}` to GitHub Packages.

            **PROTOTYPE — single-contributor trusted setup. NOT mainnet-safe.**

            `Verifier3x3.sol` is the deployed transact verifier. `Verifier2x2.sol`
            and `Verifier4x4.sol` are the other two instantiations and are **not**
            deployed — do not install either as
            `contracts/src/verifiers/Verifier.sol`.

            `4x4` is built on the 2^17 ptau: its proofs cost roughly twice a `3x3`
            proof, and it has no `PubInputs.sol` compress overload yet, so nothing
            verifies it on-chain today.

            ### Release asset SHA-256

            ```
            ${{ steps.shas.outputs.release_shas }}
            ```

            Verify a downloaded asset locally:
            ```
            shasum -a 256 <file>
            ```

            The `*_final.zkey` and `*verification_key.json` SHAs differ across
            builds because the contribution step is non-deterministic. The hashes
            recorded above are the canonical values for this exact release.

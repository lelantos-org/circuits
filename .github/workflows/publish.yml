name: publish

# Tag-driven release. Pushing a tag matching `v*` (e.g. `v0.1.0`) rebuilds the
# artifacts from circom and ptau, runs the artifact checks, publishes to GitHub
# Packages, and writes per-release SHA-256 hashes into the release body for
# downstream verification.
#
# The trusted-setup ceremony is non-deterministic (snarkjs mixes fresh
# randomness into the contribution regardless of `-e`), so zkey and vkey
# SHA-256 digests are recorded per release rather than pinned in advance.
#
# Builds and checks run before `npm publish`, because publishing to
# GitHub Packages is irreversible: the version number is consumed even if the
# subsequent release step fails.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [ubuntu-latest]
    timeout-minutes: 60
    permissions:
      contents: write   # required to attach SHAs to the release body
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@lelantos-org"
          always-auth: true
          cache: npm

      - name: Confirm tag version matches package.json
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      - name: Install just
        uses: extractions/setup-just@v2

      # The action pins the circom version, so the release uses the same circom
      # as CI. This job does not use ./.github/actions/setup because it needs
      # registry-url / scope / always-auth on setup-node and interleaves the
      # tag-version check and ptau cache between setup steps.
      - name: Setup circom
        uses: ./.github/actions/setup-circom

      # Each ceremony has its own ptau: Transact(11,4,6) at 100,304 constraints
      # needs 2^17; TreeUpdateBatch(11,8) at 55,190 fits 2^16. `just` fetches
      # both from lelantos-org/ptau and verifies the digest on every run,
      # including cache hits. Each cache key includes the digest, so an entry
      # with different contents misses and is refetched.
      - name: Cache ptau-17
        uses: actions/cache@v4
        with:
          path: ptau/powersOfTau28_hez_final_17.ptau
          key: ptau-17-6b662a324867139fb1a20a324d90b6ff61856dfb23f59326909f14b0e2483ae0

      - name: Cache ptau-16
        uses: actions/cache@v4
        with:
          path: ptau/powersOfTau28_hez_final_16.ptau
          key: ptau-16-1c401abb57c9ce531370f3015c3e75c0892e0f32b8b1e94ace0f6682d9695922

      - name: Install npm dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The package ships vectors/, which the SDK tests against. No other step
      # detects stale vectors, and regeneration is faster than the ceremonies
      # below.
      - name: Golden vectors are current
        run: just vectors-check

      # Runs the transact ceremony and the artifact checks.
      - name: Build + verify 4x6 artifacts
        run: just package

      - name: Setup build-circuit
        uses: ./.github/actions/setup-build-circuit

      - name: Build tree_update_batch artifacts
        run: |
          just compile-batch setup-batch
          # Stage the flat wasm next to its r1cs for release upload.
          cp build/tree_update_batch_js/tree_update_batch.wasm build/tree_update_batch.wasm
          # The witness-calculation graph the relayer proves against. Built
          # after setup-batch so its r1cs is compared with the compile the
          # ceremony used.
          just build-graph

      # Release assets are named by shape rather than a bare `Verifier.sol`, so
      # one circuit's verifier cannot be mistaken for another's.
      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p release
          cp build/4x6.r1cs                          release/4x6.r1cs
          cp build/4x6.wasm                          release/4x6.wasm
          cp build/4x6_final.zkey                    release/4x6_final.zkey
          cp build/4x6_verification_key.json         release/4x6_verification_key.json
          cp build/Verifier_4x6.sol                  release/Verifier4x6.sol
          cp build/tree_update_batch.r1cs            release/tree_update_batch.r1cs
          cp build/tree_update_batch.wasm            release/tree_update_batch.wasm
          cp build/tree_update_batch.wcd             release/tree_update_batch.wcd
          cp build/tree_update_batch_final.zkey      release/tree_update_batch_final.zkey
          cp build/tree_update_batch_verification_key.json \
                                                     release/tree_update_batch_verification_key.json
          # The generated contract name collides with the transact verifier's, so
          # it is renamed to allow compiling both together.
          sed 's/contract Groth16Verifier/contract TreeUpdateBatchGroth16Verifier/' \
            build/Verifier_tree_update_batch.sol > release/TreeUpdateBatchVerifier.sol

      - name: Record release asset hashes
        id: shas
        run: |
          set -euo pipefail
          {
              echo 'release_shas<<EOF'
              ( cd release && sha256sum -- * )
              echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # `files` in package.json is a whitelist, and npm silently skips missing
      # entries, so a stale filename would ship an index.json referencing a
      # vector absent from the tarball. Asserts the tarball contains every file
      # index.json lists.
      - name: Package contents match the vector index
        run: |
          set -euo pipefail
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            const pack = require("/tmp/pack.json")[0];
            const shipped = new Set(pack.files.map(f => f.path));
            const index = require("./vectors/index.json");
            const missing = ["vectors/index.json", ...Object.keys(index.files).map(f => `vectors/${f}`)]
              .filter(f => !shipped.has(f));
            if (missing.length) {
              console.error(`::error::package.json files/exports omit: ${missing.join(", ")}`);
              process.exit(1);
            }
            console.log(`package ships ${shipped.size} files, including every published vector`);
          '

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach artifacts + release notes
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body: |
            Published `@lelantos-org/circuits@${{ github.ref_name }}` to GitHub Packages.

            **PROTOTYPE — single-contributor trusted setup. NOT mainnet-safe.**

            `Verifier4x6.sol` is the transact verifier — `Transact(11, 4, 6)`,
            the only shape this package ships. `TreeUpdateBatchVerifier.sol` is
            its ceremony-paired batch verifier at `TreeUpdateBatch(11, 8)`; the
            two share a tree depth and must be installed together.

            `4x6` is built on the 2^17 ptau and `tree_update_batch` on the 2^16
            ptau. Note `4x6` has no `PubInputs.sol`
            compress overload yet — it needs one at 69 slots, with a 50-word
            calldata prefix — so nothing verifies it on-chain today.

            ### Release asset SHA-256

            ```
            ${{ steps.shas.outputs.release_shas }}
            ```

            Verify a downloaded asset locally:
            ```
            shasum -a 256 <file>
            ```

            The `*_final.zkey` and `*verification_key.json` SHAs differ across
            builds because the contribution step is non-deterministic. The hashes
            recorded above are the canonical values for this exact release.

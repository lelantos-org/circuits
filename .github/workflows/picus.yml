name: picus

# Under-constrainedness checking (Veridise Picus + z3). Not run on pull_request:
# building the image and solving each circuit's R1CS is too slow for a PR check.
#
# Uses weak safety: every output is uniquely determined by the inputs. Strong
# safety extends this to intermediate signals; run `just picus-all 1` manually
# when adding a gadget.

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A run still in progress when the next one starts is left to finish.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  picus:
    runs-on: [ubuntu-latest]
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup toolchain
        uses: ./.github/actions/setup

      # Runners are x86_64, so this builds the upstream image as `picus:local`
      # rather than docker/picus-arm64.Dockerfile.
      - name: Build Picus image
        run: docker build -t picus:local https://github.com/Veridise/Picus.git

      # Exits non-zero if any circuit is under-constrained or unknown.
      - name: Check all circuits are properly constrained
        run: just picus-all

name: picus

# Formal under-constrainedness checking (Veridise Picus + z3).
#
# Not run on pull_request: building the Docker image from upstream source and
# solving each circuit's R1CS is too slow for a PR check. The checked properties
# are typically affected by adding gadgets rather than by ordinary changes.
#
# Uses weak safety, matching `just picus-all` with no STRONG argument: every
# output is uniquely determined by the inputs. Strong safety extends this to
# intermediate signals at significantly higher solver cost; run
# `just picus-all 1` manually when adding a gadget.

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A nightly run still in progress when the next one starts is not cancelled, so
# it can complete its verdict.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  picus:
    runs-on: [ubuntu-latest]
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup toolchain
        uses: ./.github/actions/setup

      # docker/picus-arm64.Dockerfile targets local arm64 use. Runners are
      # x86_64, so this builds the upstream image as `picus:local`, which
      # `just picus` uses when `picus:arm64` is absent.
      - name: Build Picus image
        run: docker build -t picus:local https://github.com/Veridise/Picus.git

      # Exits non-zero if any circuit is UNDER-CONSTRAINED or unknown.
      # `picus-all` continues after a failure so every verdict is reported.
      - name: Check all circuits are properly constrained
        run: just picus-all

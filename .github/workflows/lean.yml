name: lean

on:
  pull_request:
    paths:
      - 'lean/**'
      - 'src/**'
      - '.github/workflows/lean.yml'
  push:
    branches: [main]
    # Same filter as `pull_request`. Without it a docs-only push to main runs
    # the full 60-minute job, including the `leanchecker` kernel re-check, for a
    # change that cannot affect a proof.
    paths:
      - 'lean/**'
      - 'src/**'
      - '.github/workflows/lean.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    runs-on: [ubuntu-latest]
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v4

      - name: Discharge the arithmetic axioms
        run: python3 scripts/check-prime.py

      # Installs elan from `lean-toolchain`, restores the `.lake` cache, pulls
      # the prebuilt Mathlib oleans (`lake exe cache get`) rather than compiling
      # Mathlib from source, and builds. Exports elan on `$GITHUB_PATH`, so the
      # `lake env` steps below work unchanged.
      - name: Build
        id: lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build-args: Lelantos
          # There is no `test` or `lint` target; do not let auto-config invent one.
          test: false
          lint: false
          # Independent kernel re-check of every declaration under the
          # `Lelantos` prefix, catching a proof that type-checks only because of
          # an elaborator bug. Run with no arguments, so its target is the
          # capitalized manifest package name; see `lean/lakefile.toml`.
          #
          # Runs on pull requests as well as pushes. The whole job is already
          # path-filtered to `lean/**` and `src/**`, so this only fires on a
          # change that could affect a proof — and a proof that survives only an
          # elaborator bug should not reach `main` in the first place.
          leanchecker: true

      # `check-axioms.sh` catches a `sorryAx` reaching a top-level theorem; this
      # also catches a `sorry` in a file nothing imports.
      - name: No `sorry`
        run: |
          if grep -rn '\bsorry\b' Lelantos/ Lelantos.lean; then
            echo "FAIL: a proof is admitted with sorry"
            exit 1
          fi
          echo "OK: no sorry"

      # The only authoritative statement of what the development assumes.
      - name: Trusted base unchanged
        run: ./scripts/check-axioms.sh

      # The public-input layout is the highest-risk hand transcription in the
      # development. This dumps one layout per instantiated shape.
      # `expected/layout-4x6.txt` is also what
      # `test/formal/layout_parity.test.ts` checks the SDK against, so it must be
      # verified against Lean here to keep that chain intact.
      - name: Public-input layout unchanged
        run: ./scripts/dump-layout.sh

      # Doc comments cite the circom lines they mirror. The citations are
      # hand-maintained, so this resolves every one of them against the file it
      # names — catching a renamed or deleted source, a citation past the end of
      # a file, and a span that has drifted away from what the comment quotes,
      # which is the way they actually rot.
      - name: Source citations resolve
        run: python3 scripts/check-citations.py

      # The other direction over the same scan: whether the citations, taken
      # together, reach every `===` and `<==` the circom emits. A constraint no
      # citation names is one the model may simply not have. The residue —
      # `frontier_root`, `fixed_base_mul`, `EmptySubtreeHashes` — is pinned in
      # `expected/coverage.txt` and diffed, the way the trusted base is.
      - name: Constraint coverage unchanged
        run: python3 scripts/check-coverage.py

      # The other half: the `Lelantos` declarations the prose names. A renamed
      # theorem, or one described in a module note but never written, is
      # invisible to the compiler — comments hold no identifiers it resolves.
      - name: Names the prose claims resolve
        run: python3 scripts/check-names.py

name: lean

on:
  pull_request:
    paths:
      - 'lean/**'
      - 'src/**'
      - '.github/workflows/lean.yml'
  push:
    branches: [main]
    # Same filter as `pull_request`.
    paths:
      - 'lean/**'
      - 'src/**'
      - '.github/workflows/lean.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    runs-on: [ubuntu-latest]
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v4

      - name: Discharge the arithmetic axioms
        run: python3 scripts/check-prime.py

      # Installs elan from `lean-toolchain`, restores the `.lake` cache, fetches
      # prebuilt Mathlib oleans, and builds. Adds elan to `$GITHUB_PATH` for the
      # `lake env` steps below.
      - name: Build
        id: lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build-args: Lelantos
          # No `test` or `lint` target exists; disable auto-configuration of them.
          test: false
          lint: false
          # Runs as a separate step, after orphaned oleans are pruned.
          leanchecker: false

      # The restored `.lake` cache may contain oleans for deleted or renamed
      # modules, which `leanchecker` would replay and fail on.
      - name: Prune build outputs of deleted modules
        run: ./scripts/prune-stale-build.sh

      # Independent kernel re-check of every declaration under the `Lelantos`
      # prefix, detecting proofs accepted only because of an elaborator bug.
      # With no arguments its target is the capitalized manifest package name
      # (see `lean/lakefile.toml`).
      - name: Kernel re-check (leanchecker)
        run: lake env leanchecker

      # Also detects `sorry` in files nothing imports, which `check-axioms.sh`
      # does not reach.
      - name: No `sorry`
        run: |
          if grep -rn '\bsorry\b' Lelantos/ Lelantos.lean; then
            echo "FAIL: a proof is admitted with sorry"
            exit 1
          fi
          echo "OK: no sorry"

      # Diffs the `#print axioms` output, the authoritative list of assumptions.
      - name: Trusted base unchanged
        run: ./scripts/check-axioms.sh

      # Diffs the public-input layout of each instantiated shape.
      # `test/formal/layout_parity.test.ts` checks the SDK against
      # `expected/layout-4x6.txt`, so that file must match Lean.
      - name: Public-input layout unchanged
        run: ./scripts/dump-layout.sh

      # Resolves every circom citation in doc comments: missing sources, lines
      # past the end of a file, and spans that do not contain the quoted text.
      - name: Source citations resolve
        run: python3 scripts/check-citations.py

      # Checks that the citations reach every `===` and `<==` in the circom; the
      # uncited residue is pinned in `expected/coverage.txt` and diffed.
      - name: Constraint coverage unchanged
        run: python3 scripts/check-coverage.py

      # Checks that the `Lelantos` declarations named in prose exist.
      - name: Names the prose claims resolve
        run: python3 scripts/check-names.py

name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [ubuntu-latest]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Run tests
        run: just test-unit

      # Fails when a circuit or layout change is not accompanied by `just vectors`.
      - name: Check golden vectors are up to date
        run: just vectors-check

      # Compares the vector copies committed in ../contracts. Skips when that
      # repository is not checked out, as on this runner.
      - name: Check consumer vector copies are up to date
        run: just vectors-consumers-check

name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [ubuntu-latest]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Run tests
        run: just test-unit

      # Regenerates vectors/ and diffs against the committed files, so a circuit
      # or layout change without `just vectors` fails before stale vectors reach
      # the SDK.
      - name: Check golden vectors are up to date
        run: just vectors-check

      # `contracts/` keeps its own copy of the batch and transact vectors,
      # because forge cannot read across repositories; this fails when the copies
      # differ. It skips when ../contracts is not checked out, as on this runner,
      # and takes effect in a CI that checks out both repositories.
      - name: Check consumer vector copies are up to date
        run: just vectors-consumers-check

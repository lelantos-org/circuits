name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [ubuntu-latest]
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CIRCOM_VERSION: v2.2.3
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Setup circom
        uses: ./.github/actions/setup-circom
        with:
          version: ${{ env.CIRCOM_VERSION }}

      - name: Install npm dependencies
        run: npm ci

      - name: Run tests
        run: just test-unit

      # Regenerates vectors/ and diffs against the committed files. A circuit or
      # layout change landed without `just vectors` fails here rather than
      # shipping a stale contract to the SDK.
      - name: Check golden vectors are up to date
        run: just vectors-check

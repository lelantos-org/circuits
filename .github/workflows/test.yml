name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [ubuntu-latest]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Run tests
        run: just test-unit

      # Regenerates vectors/ and diffs against the committed files, so a circuit
      # or layout change landed without `just vectors` fails here rather than
      # shipping a stale contract to the SDK.
      - name: Check golden vectors are up to date
        run: just vectors-check

      # `contracts/` keeps its own copy of the batch and transact vectors,
      # because forge cannot read across a repository boundary. A copy is a
      # second source of truth, so this fails when the two disagree. Skips
      # itself when ../contracts is not checked out, which is the case on this
      # runner today — it is here so a workspace CI that does check out both
      # gets the gate for free.
      - name: Check consumer vector copies are up to date
        run: just vectors-consumers-check

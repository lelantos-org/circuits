name: Setup build-circuit
description: >-
  Make `just build-graph` runnable: install protoc and put the pinned
  `build-circuit` in .tools/, restoring it from cache when the pin is unchanged.

  Shared by build.yml and publish.yml. publish.yml does not use
  ./.github/actions/setup (it needs its own setup-node), so this cannot live
  there.

runs:
  using: composite
  steps:
    # circom-witnesscalc compiles a protobuf schema in a build script; without
    # protoc, prost-build fails with a compile error.
    - name: Install protoc
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends protobuf-compiler
        protoc --version

    # The pin, read from the justfile, is the cache key, so bumping CWC_REV rebuilds.
    - name: Read the pinned build-circuit revision
      id: pin
      shell: bash
      run: |
        rev=$(just --evaluate CWC_REV)
        echo "rev=${rev}" >> "$GITHUB_OUTPUT"
        echo "build-circuit pinned at ${rev}"

    # Caches the installed binary: build-circuit takes minutes to compile from cold.
    - name: Cache build-circuit
      uses: actions/cache@v4
      with:
        path: .tools/build-circuit
        key: build-circuit-${{ runner.os }}-${{ steps.pin.outputs.rev }}

    - name: Build build-circuit if not cached
      shell: bash
      run: just _ensure-build-circuit

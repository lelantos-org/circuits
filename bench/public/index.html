<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>MASP 2x2 Proof Bench</title>
<style>
  body { font: 14px system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.2rem; }
  button { font-size: 1rem; padding: .6rem 1rem; }
  input[type=number] { width: 4rem; }
  table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
  th, td { border: 1px solid #ccc; padding: .3rem .5rem; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  #log { white-space: pre-wrap; background: #f4f4f4; padding: .5rem; min-height: 6em; font-family: ui-monospace, monospace; font-size: 12px; }
  .row { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; margin: .5rem 0; }
  .ok { color: #060; } .err { color: #c00; }
</style>
</head>
<body>
<h1>MASP 2x2 Groth16 proof bench</h1>
<div class="row">
  <label>iters: <input id="iters" type="number" min="1" max="50" value="5" /></label>
  <label>label: <input id="label" type="text" placeholder="e.g. iPhone 15 Safari" /></label>
  <button id="run">Run benchmark</button>
  <span id="status"></span>
</div>
<div id="log"></div>
<table id="tbl">
  <thead><tr>
    <th>device</th><th>cores</th><th>iters</th>
    <th>mean (ms)</th><th>median (ms)</th><th>min</th><th>max</th><th>when</th>
  </tr></thead>
  <tbody></tbody>
</table>
<script src="/snarkjs.min.js"></script>
<script src="/bench.js"></script>
</body>
</html>
